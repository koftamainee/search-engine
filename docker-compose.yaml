services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - CONFIG_PATH=config/prod.json
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - SESSION_STORAGE_HOST=session-storage
      - SESSION_STORAGE_PORT=6379
      - SESSION_STORAGE_PASSWORD=${SESSION_STORAGE_PASSWORD}
      - MEILI_HOST=meilisearch
      - MEILI_PORT=7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q --server-response http://localhost:8080/v1/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      session-storage:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      feature-storage:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:3000"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    image: ghcr.io/${GITHUB_REPOSITORY}/crawler:${IMAGE_TAG:-latest}
    environment:
      - CRAWLER_HOST=0.0.0.0
      - CRAWLER_PORT=8080
      - CRAWL_STATE_HOST=crawler-state
      - CRAWL_STATE_PORT=6379
      - CRAWL_STATE_PASSWORD=${CRAWL_STATE_PASSWORD}
      - MEILI_HOST=meilisearch
      - MEILI_PORT=7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - CRAWLER_NUM_WORKERS=5
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      crawler-state:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped

  metrics-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/metrics-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - METRICS_SERVICE_PORT=${METRICS_SERVICE_PORT}
      - MESSAGE_BROKER_HOST=${MESSAGE_BROKER_HOST}
      - MESSAGE_BROKER_PORT=${MESSAGE_BROKER_PORT}
      - FEATURE_STORAGE_HOST=${FEATURE_STORAGE_HOST}
      - FEATURE_STORAGE_PORT=${FEATURE_STORAGE_PORT}
      - FEATURE_STORAGE_PASSWORD=${FEATURE_STORAGE_PASSWORD}
      - RUST_LOG=${RUST_LOG}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${METRICS_SERVICE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      message-broker:
        condition: service_healthy
      feature-storage:
        condition: service_healthy

  message-broker:
    image: nats:2.14-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats_server.conf", "-js"]
    volumes:
      - message_broker_data:/data
      - ./nats/nats_server.conf:/etc/nats/nats_server.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  session-storage:
    image: redis:7
    restart: unless-stopped
    volumes:
      - session_storage_data:/data
      - ./db/redis/session_storage.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${SESSION_STORAGE_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${SESSION_STORAGE_PASSWORD} ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler-state:
    image: redis:7
    restart: unless-stopped
    volumes:
      - crawler_state_data:/data
      - ./db/redis/crawler_state.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${CRAWL_STATE_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${CRAWL_STATE_PASSWORD} ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  feature-storage:
    image: redis:7
    restart: unless-stopped
    volumes:
      - feature_storage_data:/data
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${FEATURE_STORAGE_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${FEATURE_STORAGE_PASSWORD} ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  graphdb:
    image: neo4j:2026.04-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${GRAPHDB_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - graphdb_data:/data
      - graphdb_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    command: [ "meilisearch", "--max-indexing-memory", "1024" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:7700/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  session_storage_data:
  crawler_state_data:
  feature_storage_data:
  meili_data:
  message_broker_data:
  graphdb_data:
  graphdb_logs:
