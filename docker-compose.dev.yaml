services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - CONFIG_PATH=config/local.json
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-backend
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MEILI_HOST=meilisearch
      - MEILI_PORT=7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --server-response http://localhost:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis-backend:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile
      target: development
    environment:
      - REDIS_CRAWLER_HOST=redis-crawler
      - REDIS_PORT=6379
      - REDIS_CRAWLER_PASSWORD=
      - MEILI_MASTER_KEY=meilikey
      - MEILI_HOST=meilisearch
      - MEILI_PORT=7700
    depends_on:
      redis-crawler:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-backend:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data_dev:/data
      - ./db/redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-crawler:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_crawler_data_dev:/data
    environment:
      - REDIS_CRAWLER_HOST=${REDIS_CRAWLER_HOST}
      - REDIS_PORT=6379
      - REDIS_CRAWLER_PASSWORD=${REDIS_CRAWLER_PASSWORD}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_CRAWLER_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=meilikey
    volumes:
      - meili_data_dev:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse_proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_dev:
  redis_data_dev:
  redis_crawler_data_dev:
  meili_data_dev: