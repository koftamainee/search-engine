services:
  backend:
    image: ""
    build: ./backend
    ports:
      - "8080"
    environment:
      - CONFIG_PATH=config/local.json

  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile
#      target: development
    ports:
      - "32423:8080" # TODO: remove this as soon as backend admin crawler api will be ready

  frontend:
    image: ""
    build: ./frontend
    ports:
      - "80"

  metrics-service:
    image: ""
    build: ./metrics-service
    environment:
      - RUST_LOG=trace

  graphdb-indexer:
    image: ""
    build: ./graphdb-indexer

  reverse_proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    environment:
      - MEILI_ENV=development