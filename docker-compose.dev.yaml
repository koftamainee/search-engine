services:
  backend:
    build: ./backend
    ports:
      - "8080"
    environment:
      - CONFIG_PATH=config/local.json

  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./crawler:/app

  frontend:
    build: ./frontend
    ports:
      - "80"

  redis-backend:
    ports:
      - "6379:6379"   # for debugging prob

  reverse_proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  meilisearch:
    environment:
      - MEILI_ENV=development