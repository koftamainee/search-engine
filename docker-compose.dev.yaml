services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=config/local.json

  crawler:
    build:
      context: crawler
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./crawler:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  redis-backend:
    ports:
      - "6379:6379"   # for debugging prob